<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard · Promoter Connect</title>
<script>try{var t=localStorage.getItem("pc-theme")}catch(e){}document.documentElement.setAttribute("data-theme",t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"))</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
<div id="pc-navbar"></div>

<main class="page-shell" id="main">
  <div class="page-header">
    <div>
      <h1 id="greeting">Dashboard</h1>
      <p>Your bookings, open gigs and ratings.</p>
    </div>
    <div class="page-actions">
      <a href="/promoter/jobs" class="btn btn-primary">Find gigs</a>
    </div>
  </div>

  <section class="section">
    <div class="section-head">
      <h2>Open gigs <span class="text-faint" id="open-count" style="font-weight:400"></span></h2>
      <a href="/promoter/jobs">See all gigs</a>
    </div>
    <div class="card-grid cols-2" id="open-gigs">
      <div class="skeleton" aria-hidden="true"><div class="skeleton-line" style="width:40%"></div><div class="skeleton-line" style="width:70%"></div></div>
      <div class="skeleton" aria-hidden="true"><div class="skeleton-line" style="width:40%"></div><div class="skeleton-line" style="width:70%"></div></div>
    </div>
  </section>

  <div class="stat-grid" id="stats"></div>

  <section class="section">
    <div class="section-head">
      <h2>Upcoming bookings</h2>
      <a href="/promoter/bookings">All bookings</a>
    </div>
    <div id="upcoming"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>Recent ratings</h2>
      <a href="/promoter/ratings">All ratings</a>
    </div>
    <div class="card" id="ratings-preview"></div>
  </section>

  <section class="section">
    <div class="section-head"><h2>Invite friends</h2></div>
    <div class="card" id="invite-card"></div>
  </section>
</main>

<div id="pc-footer"></div>

<script type="module">
  import { requireAuth } from "/js/auth.js";
  import { mountLayout } from "/js/layout.js";
  import { mountInviteCard } from "/js/referrals.js";
  import { getPromoter } from "/js/db.js";
  import { listOpenEvents, reconcileUrgentWindow } from "/js/events.js";
  import { listPromoterBookings, promoterApplicationStatuses } from "/js/booking.js";
  import { listRatingsFor } from "/js/ratings.js";
  import { jobCardHTML, tickCountdowns, bookingRowHTML, tickEventStarts, groupBookings } from "/js/render.js";
  import { eventStartDate } from "/js/ui.js";
  import { stars, escapeHTML, fmtMoney } from "/js/ui.js";
  import { distanceLabel, isReachableWithinHour } from "/js/geo.js";

  mountLayout({ role: "promoter" });
  const { user, profile } = await requireAuth("promoter");
  mountInviteCard(document.getElementById("invite-card"), { uid: user.uid, name: profile.displayName, code: profile.referralCode });

  const [promoter, openEvents, bookings, ratings, applied] = await Promise.all([
    getPromoter(user.uid), listOpenEvents(), listPromoterBookings(user.uid), listRatingsFor(user.uid), promoterApplicationStatuses(user.uid),
  ]);

  const firstName = promoter.fullName?.split(" ")[0];
  if (firstName) document.getElementById("greeting").textContent = `Hi, ${firstName}`;

  // Open gigs: everything still taking people, urgent first, then soonest.
  const bookedEventIds = new Set(bookings.map((b) => b.eventId));
  const open = (await Promise.all(openEvents.map(reconcileUrgentWindow)))
    .filter((e) => e.status === "open" && !e.isDemo && !bookedEventIds.has(e.id))
    .sort((a, b) => (b.hiringType === "urgent") - (a.hiringType === "urgent")
      || (eventStartDate(a.date, a.startTime) || 0) - (eventStartDate(b.date, b.startTime) || 0));
  open.forEach((e) => { e._application = applied[e.id]; });
  if (promoter.location?.lat != null) {
    open.forEach((e) => {
      if (!e.locationGeo) return;
      e._distanceLabel = distanceLabel(promoter.location, e.locationGeo);
      e._reachable = isReachableWithinHour(promoter.location, e.locationGeo);
    });
  }

  const { upcoming } = groupBookings(bookings);
  const earned = bookings.filter((b) => b.status === "completed").reduce((sum, b) => sum + (b.paymentAmount || 0), 0);

  document.getElementById("stats").innerHTML = `
    <div class="stat-tile"><div class="stat-label">Upcoming</div><div class="stat-value">${upcoming.length}</div></div>
    <div class="stat-tile"><div class="stat-label">Events completed</div><div class="stat-value">${promoter.eventsCompleted || 0}</div></div>
    <div class="stat-tile"><div class="stat-label">Average rating</div><div class="stat-value">${promoter.ratingCount ? promoter.ratingAvg.toFixed(1) : "–"}</div></div>
    <div class="stat-tile"><div class="stat-label">Earned</div><div class="stat-value">${fmtMoney(earned)}</div><div class="stat-sub">from completed events</div></div>`;

  const openHost = document.getElementById("open-gigs");
  document.getElementById("open-count").textContent = open.length ? `(${open.length})` : "";
  if (open.length) {
    openHost.innerHTML = open.slice(0, 6).map((e) => jobCardHTML(e, { showActions: false })).join("");
    openHost.querySelectorAll(".job-card").forEach((card) => {
      const event = open.find((e) => e.id === card.dataset.eventId);
      const href = `/promoter/jobs?q=${encodeURIComponent(event.eventName)}`;
      card.classList.add("clickable");
      card.setAttribute("role", "link");
      card.tabIndex = 0;
      card.addEventListener("click", () => { location.href = href; });
      card.addEventListener("keydown", (ev) => { if (ev.key === "Enter") location.href = href; });
      if (event._application) card.insertAdjacentHTML("beforeend", `<div class="text-sm text-dim">You've applied</div>`);
    });
    tickCountdowns(openHost);
    setInterval(() => tickCountdowns(openHost), 1000);
  } else {
    openHost.outerHTML = `<div class="empty-state boxed">No open gigs right now. You'll get a notification the moment a company posts one.</div>`;
  }

  document.getElementById("upcoming").innerHTML = upcoming.length
    ? `<div class="list">${upcoming.slice(0, 4).map(bookingRowHTML).join("")}</div>`
    : `<div class="empty-state boxed"><h3>No upcoming bookings</h3>Apply to a gig or book an urgent spot to see it here.<br><a class="btn btn-secondary" href="/promoter/jobs">Browse gigs</a></div>`;
  tickEventStarts();
  setInterval(tickEventStarts, 1000);

  document.getElementById("ratings-preview").innerHTML = ratings.length
    ? `<div class="mb-16">${stars(promoter.ratingAvg || 0, promoter.ratingCount || 0)}</div>` +
      ratings.slice(0, 3).map((r) => `
        <div class="review">
          <div class="review-head"><strong>${r.overall.toFixed(1)} out of 5</strong></div>
          ${r.comment ? `<p>${escapeHTML(r.comment)}</p>` : ""}
        </div>`).join("")
    : `<p class="text-dim">No ratings yet. Companies rate you after each event they mark as complete.</p>`;
</script>
</body>
</html>
