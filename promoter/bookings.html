<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bookings · Promoter Connect</title>
<script>try{var t=localStorage.getItem("pc-theme")}catch(e){}document.documentElement.setAttribute("data-theme",t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"))</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
<div id="pc-navbar"></div>

<main class="page-shell" id="main">
  <div class="page-header">
    <div>
      <h1>Bookings</h1>
      <p>Everything you've booked or been accepted for.</p>
    </div>
  </div>

  <div class="pc-tabs" id="tabs">
    <button class="pc-tab" data-tab="upcoming" aria-selected="true">Upcoming <span class="count" id="count-upcoming"></span></button>
    <button class="pc-tab" data-tab="completed" aria-selected="false">Completed <span class="count" id="count-completed"></span></button>
    <button class="pc-tab" data-tab="cancelled" aria-selected="false">Cancelled <span class="count" id="count-cancelled"></span></button>
  </div>

  <div id="list" role="tabpanel"><div class="loading-state"><div class="spinner"></div></div></div>
</main>

<div id="pc-footer"></div>

<script type="module">
  import { requireAuth } from "/js/auth.js";
  import { mountLayout } from "/js/layout.js";
  import { listPromoterBookings } from "/js/booking.js";
  import { bookingRowHTML, tickEventStarts, ACTIVE_BOOKING_STATUSES } from "/js/render.js";
  import { initTabs } from "/js/ui.js";

  mountLayout({ role: "promoter" });
  const { user } = await requireAuth("promoter");
  const bookings = await listPromoterBookings(user.uid);

  const groups = {
    upcoming: bookings.filter((b) => ACTIVE_BOOKING_STATUSES.includes(b.status)),
    completed: bookings.filter((b) => b.status === "completed"),
    cancelled: bookings.filter((b) => b.status === "cancelled"),
  };
  const emptyText = {
    upcoming: `Nothing booked yet. <a class="link" href="/promoter/jobs.html">Find a gig</a>`,
    completed: "Events you've worked will show up here.",
    cancelled: "No cancelled bookings.",
  };
  Object.entries(groups).forEach(([key, items]) => {
    document.getElementById(`count-${key}`).textContent = items.length || "";
  });

  initTabs(document.getElementById("tabs"), (tab) => {
    const items = groups[tab];
    document.getElementById("list").innerHTML = items.length
      ? `<div class="list">${items.map(bookingRowHTML).join("")}</div>`
      : `<div class="empty-state boxed">${emptyText[tab]}</div>`;
    tickEventStarts();
  });
  setInterval(tickEventStarts, 1000);
</script>
</body>
</html>
