<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>try{document.documentElement.setAttribute("data-theme", localStorage.getItem("pc-theme") || "light");}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Bookings — Promoter Connect</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
<div id="pc-navbar"></div>

<div class="page-shell">
  <div class="page-header"><h1>📅 My Bookings</h1><p>Track upcoming and completed events.</p></div>

  <div class="pc-tabs">
    <div class="pc-tab active" data-tab="upcoming">Upcoming</div>
    <div class="pc-tab" data-tab="completed">Completed</div>
    <div class="pc-tab" data-tab="cancelled">Cancelled</div>
  </div>

  <div id="list"></div>
</div>

<div id="pc-footer"></div>

<script type="module">
  import { requireAuth } from "/js/auth.js";
  import { mountLayout } from "/js/layout.js";
  import { listPromoterBookings } from "/js/booking.js";
  import { fmtDate, escapeHTML, fmtEventCountdown, eventStartDate } from "/js/ui.js";

  mountLayout({ role: "promoter" });
  const { user } = await requireAuth("promoter");
  const bookings = await listPromoterBookings(user.uid);

  const groups = {
    upcoming: bookings.filter((b) => ["booked", "on_the_way", "checked_in", "active"].includes(b.status)),
    completed: bookings.filter((b) => b.status === "completed"),
    cancelled: bookings.filter((b) => b.status === "cancelled"),
  };

  function render(tab) {
    const items = groups[tab];
    document.getElementById("list").innerHTML = items.length
      ? items.map((b) => `
        <a href="/promoter/event.html?id=${b.id}" class="promoter-row mb-16" style="justify-content:space-between;">
          <div class="flex gap-16" style="align-items:center;">
            <div class="avatar">${(b.eventName || "?")[0]}</div>
            <div>
              <strong>${escapeHTML(b.eventName)}</strong>
              <p class="text-dim" style="font-size:12px;">📍 ${escapeHTML(b.location)} · 📅 ${fmtDate(b.date)} · 🕐 ${b.startTime}–${b.endTime}</p>
              <p class="text-dim" style="font-size:12px;">🎟️ ${b.bookingCode}</p>
              ${["booked","on_the_way"].includes(b.status) ? `<p class="mt-8" style="font-size:12px;font-weight:700;color:var(--pink);" data-event-start="${eventStartDate(b.date, b.startTime)?.getTime() || ""}">⏱️ —</p>` : ""}
            </div>
          </div>
          <div class="text-center">
            <span class="status-pill status-${b.status}">${b.status.replace("_"," ").toUpperCase()}</span>
            <div class="text-dim mt-8" style="font-size:13px;">₹${Number(b.paymentAmount||0).toLocaleString("en-IN")}</div>
          </div>
        </a>`).join("")
      : `<div class="empty-state"><div class="empty-state-icon">📭</div>Nothing here yet.</div>`;
    tickBookingCountdowns();
  }

  function tickBookingCountdowns() {
    document.querySelectorAll("[data-event-start]").forEach((el) => {
      const target = Number(el.dataset.eventStart);
      if (!target) { el.textContent = ""; return; }
      const label = fmtEventCountdown(target - Date.now());
      el.textContent = label ? `⏱️ Starts in ${label}` : "🟢 Event started";
    });
  }
  setInterval(tickBookingCountdowns, 1000);

  document.querySelectorAll(".pc-tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".pc-tab").forEach((t) => t.classList.remove("active"));
      tab.classList.add("active");
      render(tab.dataset.tab);
    });
  });

  render("upcoming");
</script>
</body>
</html>
