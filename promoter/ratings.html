<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ratings · Promoter Connect</title>
<script>try{var t=localStorage.getItem("pc-theme")}catch(e){}document.documentElement.setAttribute("data-theme",t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"))</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
<div id="pc-navbar"></div>

<main class="page-shell narrow" id="main">
  <div class="page-header">
    <div>
      <h1>Ratings</h1>
      <p>What companies said after working with you.</p>
    </div>
  </div>
  <div class="card mb-24" id="summary"></div>
  <div class="card" id="list"><div class="loading-state"><div class="spinner"></div></div></div>
</main>

<div id="pc-footer"></div>

<script type="module">
  import { requireAuth } from "/js/auth.js";
  import { mountLayout } from "/js/layout.js";
  import { getPromoter } from "/js/db.js";
  import { listRatingsFor, CATEGORY_LABELS } from "/js/ratings.js";
  import { stars, escapeHTML, fmtTimestamp } from "/js/ui.js";

  mountLayout({ role: "promoter" });
  const { user } = await requireAuth("promoter");
  const [promoter, ratings] = await Promise.all([getPromoter(user.uid), listRatingsFor(user.uid)]);

  document.getElementById("summary").innerHTML = `
    <div class="flex-between" style="flex-wrap:wrap">
      ${stars(promoter.ratingAvg || 0, promoter.ratingCount || 0)}
      <span class="text-dim text-sm">${promoter.eventsCompleted || 0} events completed</span>
    </div>`;

  document.getElementById("list").innerHTML = ratings.length
    ? ratings.map((r) => `
      <div class="review">
        <div class="review-head">
          <strong>${r.overall.toFixed(1)} out of 5</strong>
          <span class="text-faint text-sm">${fmtTimestamp(r.createdAt)}</span>
        </div>
        ${r.comment ? `<p>${escapeHTML(r.comment)}</p>` : ""}
        <div class="review-cats">
          ${Object.entries(r.categories || {}).map(([k, v]) => `<span>${escapeHTML(CATEGORY_LABELS[k] || k)}: ${Number(v)}</span>`).join("")}
        </div>
      </div>`).join("")
    : `<div class="empty-state">No ratings yet. Companies can rate you once they mark an event you worked as complete.</div>`;
</script>
</body>
</html>
