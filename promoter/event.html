<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Booking · Promoter Connect</title>
<script>try{var t=localStorage.getItem("pc-theme")}catch(e){}document.documentElement.setAttribute("data-theme",t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"))</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
<div id="pc-navbar"></div>

<main class="page-shell narrow" id="main">
  <a href="/promoter/bookings" class="back-link" id="back-link"></a>
  <div id="content"><div class="loading-state"><div class="spinner"></div></div></div>
</main>

<div id="pc-footer"></div>

<script type="module">
  import { requireAuth } from "/js/auth.js";
  import { mountLayout } from "/js/layout.js";
  import { getBooking, updateBookingStatus, cancelBooking } from "/js/booking.js";
  import { getEvent } from "/js/events.js";
  import { submitCheckIn, listCheckInsForBooking } from "/js/checkin.js";
  import { hasRated, submitRating, categoriesFor } from "/js/ratings.js";
  import { eventDetailsHTML } from "/js/render.js";
  import { toast, confirmDialog, escapeHTML, safeUrl, statusPill, fmtEventCountdown, eventStartDate, fmtTimestamp, fmtMoney } from "/js/ui.js";
  import { icon } from "/js/icons.js";
  import { mountRatingForm } from "/js/rating-form.js";

  mountLayout({ role: "promoter" });
  const { user } = await requireAuth("promoter");
  document.getElementById("back-link").innerHTML = `${icon("arrowLeft", 14)}All bookings`;

  const bookingId = new URLSearchParams(location.search).get("id");
  const content = document.getElementById("content");
  let countdownTimer = null;

  const notFound = () => {
    content.innerHTML = `<div class="empty-state boxed"><h3>Booking not found</h3>It may have been removed. <a class="link" href="/promoter/bookings">Back to bookings</a></div>`;
  };

  async function render() {
    const booking = bookingId ? await getBooking(bookingId) : null;
    if (!booking || booking.promoterId !== user.uid) return notFound();
    const [event, checkIns, alreadyRated] = await Promise.all([
      getEvent(booking.eventId),
      listCheckInsForBooking(bookingId),
      booking.status === "completed" ? hasRated(bookingId, "promoter") : false,
    ]);
    const upcoming = ["booked", "on_the_way"].includes(booking.status);

    content.innerHTML = `
      <div class="card mb-24">
        <div class="event-header">
          <div>
            <h1>${escapeHTML(booking.eventName)}</h1>
            ${booking.brand ? `<p>${escapeHTML(booking.brand)}</p>` : ""}
          </div>
          ${statusPill(booking.status)}
        </div>
        ${eventDetailsHTML(event || booking)}
        <dl class="detail-list mt-16">
          <dt>Booking code</dt><dd><code>${escapeHTML(booking.bookingCode)}</code></dd>
          <dt>Payment</dt><dd>${fmtMoney(booking.paymentAmount)} · ${statusPill(booking.paymentStatus)}</dd>
        </dl>
        ${event?.companyId ? `<p class="mt-16 text-sm"><a class="link" href="/shared/company-profile?id=${encodeURIComponent(event.companyId)}">View company profile</a></p>` : ""}
        ${upcoming ? `
        <div class="event-actions">
          ${booking.status === "booked" ? `<button class="btn btn-secondary" id="otw-btn">I'm on my way</button>` : ""}
          <button class="btn btn-danger" id="cancel-btn">Cancel booking</button>
        </div>` : ""}
      </div>

      ${upcoming ? `
      <div class="card countdown-card mb-24">
        <p class="tracker-label">Starts in</p>
        <div class="tracker-timer" id="event-countdown">–</div>
      </div>

      <div class="card mb-24">
        <h2 class="card-title">Check in at the venue</h2>
        <p class="text-dim text-sm mb-16">When you get there, take a photo so the company knows you've arrived. Your location is attached if your browser allows it.</p>
        <div class="field">
          <label for="checkin-photo">Photo</label>
          <input type="file" id="checkin-photo" accept="image/*" capture="environment" />
        </div>
        <button class="btn btn-primary btn-block" id="checkin-btn">Check in</button>
      </div>` : ""}

      ${checkIns.length ? `
      <div class="card mb-24">
        <h2 class="card-title">Checked in</h2>
        ${checkIns.map((c) => `
          <p class="text-dim text-sm">${fmtTimestamp(c.timestamp) || "Just now"}${c.location ? ` · ${c.location.lat.toFixed(3)}, ${c.location.lng.toFixed(3)}` : ""}</p>
          ${safeUrl(c.photoURL) ? `<div class="checkin-photo"><img src="${safeUrl(c.photoURL)}" alt="Check-in photo" loading="lazy" /></div>` : ""}
        `).join("")}
      </div>` : ""}

      ${booking.status === "completed" ? `
      <div class="card">
        ${alreadyRated
          ? `<p class="text-dim">You've rated this company. Thanks.</p>`
          : `<h2 class="card-title">Rate the company</h2><p class="text-dim text-sm mb-16">Other promoters see this before they take a gig with them.</p><div id="rating-form"></div>`}
      </div>` : ""}`;

    document.getElementById("otw-btn")?.addEventListener("click", async () => {
      await updateBookingStatus(bookingId, "on_the_way");
      toast("Marked as on your way.", "success");
      render();
    });

    document.getElementById("cancel-btn")?.addEventListener("click", async () => {
      const ok = await confirmDialog("Cancel this booking? Your spot goes back to other promoters.", { confirmLabel: "Cancel booking", danger: true });
      if (!ok) return;
      await cancelBooking(bookingId, booking.eventId);
      toast("Booking cancelled.");
      render();
    });

    document.getElementById("checkin-btn")?.addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      const file = document.getElementById("checkin-photo").files[0];
      if (!file) return toast("Add a photo first.", "error");
      btn.disabled = true;
      btn.textContent = "Uploading…";
      try {
        await submitCheckIn(booking, file);
        toast("Checked in. The company can see you've arrived.", "success");
        render();
      } catch (err) {
        toast(err.message, "error");
        btn.disabled = false;
        btn.textContent = "Check in";
      }
    });

    clearInterval(countdownTimer);
    const countdownEl = document.getElementById("event-countdown");
    const start = eventStartDate(booking.date, booking.startTime);
    if (countdownEl && start) {
      const tick = () => { countdownEl.textContent = fmtEventCountdown(start - Date.now()) || "Started"; };
      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    if (booking.status === "completed" && !alreadyRated) {
      mountRatingForm(document.getElementById("rating-form"), categoriesFor("promoter"), async (values, comment) => {
        await submitRating(booking, "promoter", values, comment);
        toast("Thanks, your rating is in.", "success");
        render();
      });
    }
  }

  render();
</script>
</body>
</html>
