<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Find gigs · Promoter Connect</title>
<script>try{var t=localStorage.getItem("pc-theme")}catch(e){}document.documentElement.setAttribute("data-theme",t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"))</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
<div id="pc-navbar"></div>

<main class="page-shell" id="main">
  <div class="page-header">
    <div>
      <h1>Find gigs</h1>
      <p>Apply to regular posts, or book an urgent spot straight away.</p>
    </div>
  </div>

  <form class="search-bar" id="search-form" role="search">
    <label for="f-keyword" class="sr-only">Search gigs</label>
    <input class="input" type="search" id="f-keyword" placeholder="Event, brand, category or area" />
    <button class="btn btn-primary" type="submit">Search</button>
  </form>

  <button type="button" class="btn btn-secondary btn-sm filters-toggle" id="filters-toggle" aria-expanded="false" aria-controls="filter-bar">Filters</button>
  <div class="filter-bar" id="filter-bar">
    <div class="field">
      <label for="f-type">Type</label>
      <select id="f-type"><option value="">All gigs</option><option value="urgent">Urgent only</option><option value="normal">Regular only</option></select>
    </div>
    <div class="field"><label for="f-location">Area</label><input type="text" id="f-location" placeholder="e.g. Andheri" /></div>
    <div class="field"><label for="f-category">Category</label><input type="text" id="f-category" placeholder="e.g. Sampling" /></div>
    <div class="field"><label for="f-date">Date</label><input type="date" id="f-date" /></div>
    <div class="field"><label for="f-payment">Min. pay (₹)</label><input type="number" id="f-payment" min="0" step="100" inputmode="numeric" /></div>
  </div>

  <div class="results-meta">
    <span id="result-count" aria-live="polite"></span>
    <label class="checkbox">
      <input type="checkbox" id="f-reachable" />
      <span>Only gigs I can reach within an hour</span>
    </label>
  </div>
  <p class="field-hint mb-16 hidden" id="no-location-hint">
    To use the distance filter, share your location on your <a class="link" href="/promoter/profile.html">profile</a>.
  </p>

  <div id="results" class="card-grid cols-2"></div>
  <div id="empty" class="empty-state boxed hidden">
    <h3>No gigs match</h3>
    Try clearing a filter or searching for something broader.
  </div>
</main>

<div id="pc-footer"></div>

<script type="module">
  import { requireAuth } from "/js/auth.js";
  import { mountLayout } from "/js/layout.js";
  import { getPromoter } from "/js/db.js";
  import { listOpenEvents, reconcileUrgentWindow } from "/js/events.js";
  import { bookPosition, applyToEvent, BOOKING_ERRORS } from "/js/booking.js";
  import { jobCardHTML, eventDetailsHTML, tickCountdowns } from "/js/render.js";
  import { toast, openModal, escapeHTML, skeletonCards, fmtDate, fmtTimeRange, fmtMoney } from "/js/ui.js";
  import { distanceLabel, isReachableWithinHour } from "/js/geo.js";

  mountLayout({ role: "promoter" });
  const { user } = await requireAuth("promoter");
  const promoter = await getPromoter(user.uid);

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  if (params.get("q")) $("f-keyword").value = params.get("q");
  if (["urgent", "normal"].includes(params.get("type"))) $("f-type").value = params.get("type");

  const hasLocation = promoter.location?.lat != null;
  $("no-location-hint").classList.toggle("hidden", hasLocation);
  $("f-reachable").disabled = !hasLocation;

  const resultsEl = $("results");
  let events = [];
  let loadId = 0;

  async function load() {
    const thisLoad = ++loadId;
    resultsEl.innerHTML = skeletonCards(4);
    $("empty").classList.add("hidden");
    let list;
    try {
      list = await listOpenEvents({
        keyword: $("f-keyword").value.trim(),
        hiringType: $("f-type").value,
        location: $("f-location").value.trim(),
        category: $("f-category").value.trim(),
        date: $("f-date").value,
        minPayment: $("f-payment").value,
      });
      list = await Promise.all(list.map(reconcileUrgentWindow));
    } catch {
      resultsEl.innerHTML = "";
      $("result-count").textContent = "";
      return toast("Couldn't load gigs. Check your connection and try again.", "error");
    }
    if (thisLoad !== loadId) return;

    list = list.filter((e) => e.status === "open" || e.status === "fulfilled");
    if (hasLocation) {
      list.forEach((e) => {
        if (!e.locationGeo) return;
        e._distanceLabel = distanceLabel(promoter.location, e.locationGeo);
        e._reachable = isReachableWithinHour(promoter.location, e.locationGeo);
      });
      if ($("f-reachable").checked) list = list.filter((e) => e._reachable === true);
    }
    list.sort((a, b) => (a.status === "open" ? 0 : 1) - (b.status === "open" ? 0 : 1) || (b.hiringType === "urgent") - (a.hiringType === "urgent"));
    events = list;

    $("result-count").textContent = `${list.length} ${list.length === 1 ? "gig" : "gigs"}`;
    $("empty").classList.toggle("hidden", list.length > 0);
    resultsEl.innerHTML = list.map((e) => jobCardHTML(e)).join("");
    tickCountdowns(resultsEl);
  }

  resultsEl.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const event = events.find((ev) => ev.id === btn.closest(".job-card").dataset.eventId);
    if (btn.dataset.action === "details") showDetails(event);
    else takeAction(btn, event);
  });

  function profileIncomplete() {
    if (promoter.city && promoter.fullName) return false;
    toast("Add your name and city to your profile before applying.", "error");
    return true;
  }

  async function takeAction(btn, event) {
    if (profileIncomplete()) return;
    const isUrgent = event.hiringType === "urgent";
    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = isUrgent ? "Booking…" : "Applying…";
    try {
      if (isUrgent) {
        const result = await bookPosition(event.id, promoter);
        showBooked(event, result);
      } else {
        await applyToEvent(event.id, promoter);
        toast(`Applied to ${event.eventName}. You'll get a notification when the company responds.`, "success", 6000);
        btn.textContent = "Applied";
        return;
      }
    } catch (err) {
      const msg = BOOKING_ERRORS[err.message] || (err.message === "ALREADY_APPLIED" ? "You've already applied to this gig." : "Something went wrong. Please try again.");
      toast(msg, "error");
      btn.disabled = false;
      btn.textContent = label;
    }
    load();
  }

  function showDetails(event) {
    const isUrgent = event.hiringType === "urgent";
    const closed = event.status !== "open" || event.positionsFilled >= event.positionsRequired;
    const modal = openModal(`
      <p class="text-dim text-sm">${escapeHTML([event.brand, isUrgent ? "Urgent" : ""].filter(Boolean).join(" · "))}</p>
      <h2>${escapeHTML(event.eventName)}</h2>
      <div class="mt-16">${eventDetailsHTML(event)}</div>
      <div class="pc-modal-actions">
        <button class="btn btn-secondary" data-close>Close</button>
        ${closed ? "" : `<button class="btn ${isUrgent ? "btn-urgent" : "btn-primary"}" id="modal-action">${isUrgent ? "Book a spot" : "Apply"}</button>`}
      </div>`);
    modal.querySelector("#modal-action")?.addEventListener("click", (e) => {
      modal.close();
      const cardBtn = resultsEl.querySelector(`[data-event-id="${CSS.escape(event.id)}"] [data-action="book"], [data-event-id="${CSS.escape(event.id)}"] [data-action="apply"]`);
      takeAction(cardBtn || e.currentTarget, event);
    });
  }

  function showBooked(event, result) {
    openModal(`
      <h2>You're booked</h2>
      <p class="text-dim">Your spot is confirmed. The company has been notified.</p>
      <dl class="detail-list mt-16">
        <dt>Event</dt><dd>${escapeHTML(event.eventName)}</dd>
        <dt>When</dt><dd>${fmtDate(event.date)}, ${fmtTimeRange(event.startTime, event.endTime)}</dd>
        <dt>Where</dt><dd>${escapeHTML(event.location)}</dd>
        <dt>Pay</dt><dd>${fmtMoney(event.paymentAmount)}</dd>
        <dt>Booking code</dt><dd><code>${escapeHTML(result.bookingCode)}</code></dd>
      </dl>
      <div class="pc-modal-actions">
        <button class="btn btn-secondary" data-close>Keep browsing</button>
        <a href="/promoter/event.html?id=${encodeURIComponent(result.bookingId)}" class="btn btn-primary">View booking</a>
      </div>`);
  }

  $("filters-toggle").addEventListener("click", (e) => {
    const open = $("filter-bar").classList.toggle("open");
    e.currentTarget.setAttribute("aria-expanded", String(open));
  });

  let debounce;
  const reload = () => { clearTimeout(debounce); debounce = setTimeout(load, 250); };
  $("search-form").addEventListener("submit", (e) => { e.preventDefault(); load(); });
  ["f-type", "f-date", "f-reachable"].forEach((id) => $(id).addEventListener("change", load));
  ["f-location", "f-category", "f-payment"].forEach((id) => $(id).addEventListener("input", reload));

  load();
  setInterval(() => tickCountdowns(resultsEl), 1000);
</script>
</body>
</html>
