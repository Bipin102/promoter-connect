<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Promoter · Promoter Connect</title>
<script>try{var t=localStorage.getItem("pc-theme")}catch(e){}document.documentElement.setAttribute("data-theme",t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"))</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
<div id="pc-navbar"></div>

<main class="page-shell" id="main"><div id="content"><div class="loading-state"><div class="spinner"></div></div></div></main>

<div id="pc-footer"></div>

<script type="module">
  import { requireAuth } from "/js/auth.js";
  import { mountLayout } from "/js/layout.js";
  import { getPromoter, listPortfolio } from "/js/db.js";
  import { listRatingsFor } from "/js/ratings.js";
  import { stars, badgeList, escapeHTML, avatarHTML, safeUrl, statusPill, fmtTimestamp } from "/js/ui.js";

  const { profile } = await requireAuth();
  mountLayout({ role: profile.role });

  const id = new URLSearchParams(location.search).get("id");
  const content = document.getElementById("content");
  const notFound = () => { content.innerHTML = `<div class="empty-state boxed"><h3>Profile not found</h3>This promoter may have deleted their account.</div>`; };

  const [promoter, portfolio, ratings] = id
    ? await Promise.all([getPromoter(id), listPortfolio(id), listRatingsFor(id)])
    : [null, [], []];

  if (!promoter) notFound();
  else {
    document.title = `${promoter.fullName || "Promoter"} · Promoter Connect`;
    const details = [
      ["Age", promoter.age],
      ["Gender", promoter.gender],
      ["Height", promoter.height],
      ["Experience", promoter.yearsExperience ? `${promoter.yearsExperience} ${promoter.yearsExperience === 1 ? "year" : "years"}` : ""],
    ].filter(([, v]) => v);
    const photos = portfolio.map((p) => safeUrl(p.url)).filter(Boolean);

    content.innerHTML = `
      <div class="profile-hero">
        ${avatarHTML(promoter.photoURL, promoter.fullName, "xl")}
        <div>
          <h1>${escapeHTML(promoter.fullName || "Promoter")}</h1>
          ${stars(promoter.ratingAvg || 0, promoter.ratingCount || 0)}
          <div class="profile-hero-meta">
            <span>${escapeHTML(promoter.city || "City not set")}</span>
            <span>${promoter.eventsCompleted || 0} events completed</span>
            ${statusPill(promoter.availability === "busy" ? "busy" : "available")}
          </div>
          <div class="profile-badges">${badgeList(promoter, "promoter")}</div>
        </div>
      </div>

      <div class="two-col">
        <div class="stack">
          <div class="card">
            <h2 class="card-title">About</h2>
            ${details.length ? `<dl class="detail-list">${details.map(([k, v]) => `<dt>${k}</dt><dd>${escapeHTML(v)}</dd>`).join("")}</dl>` : `<p class="text-dim">No details added yet.</p>`}
            ${tagBlock("Skills", promoter.skills)}
            ${tagBlock("Languages", promoter.languages)}
            ${tagBlock("Brands worked with", promoter.brands)}
            ${tagBlock("Event types", promoter.categories)}
          </div>

          <div class="card">
            <h2 class="card-title">Portfolio</h2>
            ${photos.length ? `<div class="gallery-grid">${photos.map((src) => `<img src="${src}" alt="" loading="lazy" />`).join("")}</div>` : `<p class="text-dim">No photos yet.</p>`}
          </div>
        </div>

        <div class="card">
          <h2 class="card-title">Reviews</h2>
          ${ratings.length ? ratings.slice(0, 10).map((r) => `
            <div class="review">
              <div class="review-head"><strong>${r.overall.toFixed(1)} out of 5</strong><span class="text-faint text-sm">${fmtTimestamp(r.createdAt)}</span></div>
              ${r.comment ? `<p>${escapeHTML(r.comment)}</p>` : ""}
            </div>`).join("") : `<p class="text-dim">No reviews yet.</p>`}
        </div>
      </div>`;
  }

  function tagBlock(label, items) {
    if (!items?.length) return "";
    return `<p class="field-label mt-16">${label}</p><div class="tag-list">${items.map((i) => `<span class="badge">${escapeHTML(i)}</span>`).join("")}</div>`;
  }
</script>
</body>
</html>
