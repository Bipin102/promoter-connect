<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Company · Promoter Connect</title>
<script>try{var t=localStorage.getItem("pc-theme")}catch(e){}document.documentElement.setAttribute("data-theme",t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"))</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
<div id="pc-navbar"></div>

<main class="page-shell" id="main"><div id="content"><div class="loading-state"><div class="spinner"></div></div></div></main>

<div id="pc-footer"></div>

<script type="module">
  import { requireAuth } from "/js/auth.js";
  import { mountLayout } from "/js/layout.js";
  import { getCompany } from "/js/db.js";
  import { listRatingsFor, CATEGORY_LABELS } from "/js/ratings.js";
  import { stars, badgeList, escapeHTML, avatarHTML, fmtTimestamp } from "/js/ui.js";

  const { profile } = await requireAuth();
  mountLayout({ role: profile.role });

  const id = new URLSearchParams(location.search).get("id");
  const content = document.getElementById("content");
  const [company, ratings] = id ? await Promise.all([getCompany(id), listRatingsFor(id)]) : [null, []];

  if (!company) {
    content.innerHTML = `<div class="empty-state boxed"><h3>Company not found</h3>This company may have deleted their account.</div>`;
  } else {
    document.title = `${company.companyName || "Company"} · Promoter Connect`;
    content.innerHTML = `
      <div class="profile-hero">
        ${avatarHTML(company.logoURL, company.companyName, "xl")}
        <div>
          <h1>${escapeHTML(company.companyName || "Company")}</h1>
          ${stars(company.ratingAvg || 0, company.ratingCount || 0)}
          <div class="profile-hero-meta">
            ${company.location ? `<span>${escapeHTML(company.location)}</span>` : ""}
            <span>${company.eventsPosted || 0} events posted</span>
            <span>${company.eventsCompleted || 0} completed</span>
          </div>
          <div class="profile-badges">${badgeList(company, "company")}</div>
        </div>
      </div>

      <div class="two-col">
        <div class="card">
          <h2 class="card-title">About</h2>
          <p class="text-dim" style="white-space:pre-line">${escapeHTML(company.description || "No description yet.")}</p>
          <dl class="detail-list mt-16">
            ${company.industry ? `<dt>Industry</dt><dd>${escapeHTML(company.industry)}</dd>` : ""}
            ${company.contact ? `<dt>Contact</dt><dd>${escapeHTML(company.contact)}</dd>` : ""}
          </dl>
        </div>

        <div class="card">
          <h2 class="card-title">What promoters say</h2>
          ${ratings.length ? ratings.slice(0, 10).map((r) => `
            <div class="review">
              <div class="review-head"><strong>${r.overall.toFixed(1)} out of 5</strong><span class="text-faint text-sm">${fmtTimestamp(r.createdAt)}</span></div>
              ${r.comment ? `<p>${escapeHTML(r.comment)}</p>` : ""}
              <div class="review-cats">${Object.entries(r.categories || {}).map(([k, v]) => `<span>${escapeHTML(CATEGORY_LABELS[k] || k)}: ${Number(v)}</span>`).join("")}</div>
            </div>`).join("") : `<p class="text-dim">No reviews yet.</p>`}
        </div>
      </div>`;
  }
</script>
</body>
</html>
