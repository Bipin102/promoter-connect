<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Company profile · Promoter Connect</title>
<script>try{var t=localStorage.getItem("pc-theme")}catch(e){}document.documentElement.setAttribute("data-theme",t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"))</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
<div id="pc-navbar"></div>

<main class="page-shell" id="main">
  <div class="page-header">
    <div>
      <h1>Company profile</h1>
      <p>Promoters look at this before taking a gig with you.</p>
    </div>
    <div class="page-actions">
      <a class="btn btn-secondary" id="public-link" href="#">See public profile</a>
    </div>
  </div>

  <div class="two-col">
    <form class="card" id="profile-form" novalidate>
      <div class="field">
        <label for="logo-input">Logo</label>
        <div class="flex gap-16" style="align-items:center">
          <div id="logo-preview"></div>
          <input type="file" id="logo-input" accept="image/*" />
        </div>
      </div>
      <div class="field"><label for="companyName">Company name</label><input type="text" id="companyName" autocomplete="organization" required /></div>
      <div class="field-row">
        <div class="field"><label for="industry">What you do</label><input type="text" id="industry" placeholder="e.g. Activation agency" /></div>
        <div class="field"><label for="location">City</label><input type="text" id="location" placeholder="e.g. Mumbai" required /></div>
      </div>
      <div class="field"><label for="contact">Contact</label><input type="text" id="contact" placeholder="Phone or email" /><p class="field-hint">Shown on your public profile.</p></div>
      <div class="field"><label for="description">About</label><textarea id="description" rows="4" placeholder="The kind of events you run and the brands you work with"></textarea></div>
      <button type="submit" class="btn btn-primary btn-lg" id="save-btn">Save profile</button>
    </form>

    <div class="card">
      <h2 class="card-title">How promoters see you</h2>
      <div id="rep-preview"></div>
    </div>
  </div>
</main>

<div id="pc-footer"></div>

<script type="module">
  import { requireAuth } from "/js/auth.js";
  import { mountLayout } from "/js/layout.js";
  import { getCompany, updateCompany } from "/js/db.js";
  import { uploadImage } from "/js/storage.js";
  import { toast, stars, badgeList, escapeHTML, avatarHTML } from "/js/ui.js";

  mountLayout({ role: "company" });
  const { user } = await requireAuth("company");
  const $ = (id) => document.getElementById(id);
  $("public-link").href = `/shared/company-profile.html?id=${encodeURIComponent(user.uid)}`;

  let company = await getCompany(user.uid);
  fillForm(company);
  renderPreview(company);

  if (new URLSearchParams(location.search).has("onboarding")) {
    toast("Welcome. Add your company details, then post your first event.", "info", 6000);
  }

  function fillForm(c) {
    $("companyName").value = c.companyName || "";
    $("industry").value = c.industry || "";
    $("location").value = c.location || "";
    $("contact").value = c.contact || "";
    $("description").value = c.description || "";
    $("logo-preview").innerHTML = avatarHTML(c.logoURL, c.companyName, "lg");
  }

  function renderPreview(c) {
    $("rep-preview").innerHTML = `
      <div class="flex gap-12" style="align-items:center">
        ${avatarHTML(c.logoURL, c.companyName)}
        <div>
          <strong>${escapeHTML(c.companyName || "Company name")}</strong>
          <div class="text-dim text-sm">${escapeHTML([c.industry, c.location].filter(Boolean).join(" · ") || "Details not added yet")}</div>
        </div>
      </div>
      <div class="mt-16">${stars(c.ratingAvg || 0, c.ratingCount || 0)}</div>
      <p class="text-dim text-sm mt-8">${c.eventsPosted || 0} events posted · ${c.eventsCompleted || 0} completed</p>
      <div class="profile-badges">${badgeList(c, "company")}</div>`;
  }

  $("profile-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!$("companyName").value.trim() || !$("location").value.trim()) return toast("Company name and city are required.", "error");
    const btn = $("save-btn");
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      const file = $("logo-input").files[0];
      const logoURL = file ? await uploadImage(`companies/${user.uid}/logo-${Date.now()}.jpg`, file) : company.logoURL || "";
      const data = {
        companyName: $("companyName").value.trim(),
        industry: $("industry").value.trim(),
        location: $("location").value.trim(),
        contact: $("contact").value.trim(),
        description: $("description").value.trim(),
        logoURL,
      };
      await updateCompany(user.uid, data);
      company = { ...company, ...data };
      $("logo-input").value = "";
      fillForm(company);
      renderPreview(company);
      toast("Profile saved.", "success");
    } catch (err) {
      toast(err.message || "Couldn't save your profile. Please try again.", "error");
    } finally {
      btn.disabled = false; btn.textContent = "Save profile";
    }
  });
</script>
</body>
</html>
