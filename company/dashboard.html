<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard · Promoter Connect</title>
<script>try{var t=localStorage.getItem("pc-theme")}catch(e){}document.documentElement.setAttribute("data-theme",t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"))</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
<div id="pc-navbar"></div>

<main class="page-shell" id="main">
  <div class="page-header">
    <div>
      <h1 id="greeting">Dashboard</h1>
      <p>Your events and who's confirmed for them.</p>
    </div>
    <div class="page-actions">
      <a href="/company/post-event.html" class="btn btn-secondary">Post an event</a>
      <a href="/company/post-event.html#urgent" class="btn btn-urgent">Need people in the next hour</a>
    </div>
  </div>

  <div class="stat-grid" id="stats"></div>

  <section class="section" id="urgent-section" hidden>
    <div class="section-head"><h2>Filling now</h2></div>
    <div class="card-grid cols-2" id="urgent-trackers"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>Upcoming events</h2>
      <a href="/company/manage-events.html">All events</a>
    </div>
    <div id="upcoming"><div class="loading-state"><div class="spinner"></div></div></div>
  </section>
</main>

<div id="pc-footer"></div>

<script type="module">
  import { requireAuth } from "/js/auth.js";
  import { mountLayout } from "/js/layout.js";
  import { getCompany } from "/js/db.js";
  import { listCompanyEvents, reconcileUrgentWindow } from "/js/events.js";
  import { fmtDate, fmtCountdown, escapeHTML, statusPill } from "/js/ui.js";

  mountLayout({ role: "company" });
  const { user } = await requireAuth("company");
  const [company, rawEvents] = await Promise.all([getCompany(user.uid), listCompanyEvents(user.uid)]);
  const events = await Promise.all(rawEvents.map(reconcileUrgentWindow));

  if (company.companyName) document.getElementById("greeting").textContent = company.companyName;

  const active = events.filter((e) => ["open", "fulfilled", "window_ended"].includes(e.status));
  const urgentLive = events.filter((e) => e.hiringType === "urgent" && e.status === "open");
  const confirmed = active.reduce((sum, e) => sum + (e.positionsFilled || 0), 0);

  document.getElementById("stats").innerHTML = `
    <div class="stat-tile"><div class="stat-label">Active events</div><div class="stat-value">${active.length}</div></div>
    <div class="stat-tile"><div class="stat-label">Promoters confirmed</div><div class="stat-value">${confirmed}</div><div class="stat-sub">across active events</div></div>
    <div class="stat-tile"><div class="stat-label">Events completed</div><div class="stat-value">${company.eventsCompleted || 0}</div></div>
    <div class="stat-tile"><div class="stat-label">Your rating</div><div class="stat-value">${company.ratingCount ? company.ratingAvg.toFixed(1) : "–"}</div></div>`;

  if (urgentLive.length) {
    document.getElementById("urgent-section").hidden = false;
    const host = document.getElementById("urgent-trackers");
    host.innerHTML = urgentLive.map((e) => `
      <a href="/company/event.html?id=${encodeURIComponent(e.id)}" class="tracker">
        <div class="tracker-head">
          <span class="tracker-title">${escapeHTML(e.eventName)}</span>
          <span class="tracker-timer" data-deadline="${Number(e.urgentDeadlineMs)}">--:--</span>
        </div>
        <div class="tracker-progress-track"><div class="tracker-progress-fill" style="width:${Math.min(100, ((e.positionsFilled || 0) / e.positionsRequired) * 100)}%"></div></div>
        <div class="tracker-counts"><span>${e.positionsFilled || 0} of ${e.positionsRequired} confirmed</span><span>time left</span></div>
      </a>`).join("");
    const tick = () => host.querySelectorAll("[data-deadline]").forEach((el) => {
      const ms = Number(el.dataset.deadline) - Date.now();
      el.textContent = fmtCountdown(ms);
      el.classList.toggle("ending", ms < 5 * 60 * 1000);
    });
    tick();
    setInterval(tick, 1000);
  }

  const eventRow = (e) => `
    <a href="/company/event.html?id=${encodeURIComponent(e.id)}" class="list-row">
      <div class="list-row-main">
        <div class="list-row-title">${escapeHTML(e.eventName)}${e.hiringType === "urgent" ? ` <span class="badge badge-urgent">Urgent</span>` : ""}</div>
        <div class="list-row-sub">${fmtDate(e.date)} · ${escapeHTML(e.location)}</div>
      </div>
      <div class="list-row-side">
        ${statusPill(e.status)}
        <span>${e.positionsFilled || 0} of ${e.positionsRequired} filled</span>
      </div>
    </a>`;

  const upcoming = events.filter((e) => ["open", "fulfilled"].includes(e.status));
  document.getElementById("upcoming").innerHTML = upcoming.length
    ? `<div class="list">${upcoming.slice(0, 6).map(eventRow).join("")}</div>`
    : `<div class="empty-state boxed"><h3>No upcoming events</h3>Post your first event and promoters can start booking.<br><a class="btn btn-primary" href="/company/post-event.html">Post an event</a></div>`;
</script>
</body>
</html>
