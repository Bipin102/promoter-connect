<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Events · Promoter Connect</title>
<script>try{var t=localStorage.getItem("pc-theme")}catch(e){}document.documentElement.setAttribute("data-theme",t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"))</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
<div id="pc-navbar"></div>

<main class="page-shell" id="main">
  <div class="page-header">
    <div>
      <h1>Events</h1>
      <p>Everything you've posted.</p>
    </div>
    <div class="page-actions">
      <a href="/company/post-event.html" class="btn btn-primary">Post an event</a>
    </div>
  </div>

  <div class="pc-tabs" id="tabs">
    <button class="pc-tab" data-tab="all" aria-selected="true">All</button>
    <button class="pc-tab" data-tab="open" aria-selected="false">Open</button>
    <button class="pc-tab" data-tab="fulfilled" aria-selected="false">Fully staffed</button>
    <button class="pc-tab" data-tab="completed" aria-selected="false">Completed</button>
    <button class="pc-tab" data-tab="closed" aria-selected="false">Ended or cancelled</button>
  </div>

  <div id="list" role="tabpanel"><div class="loading-state"><div class="spinner"></div></div></div>
</main>

<div id="pc-footer"></div>

<script type="module">
  import { requireAuth } from "/js/auth.js";
  import { mountLayout } from "/js/layout.js";
  import { listCompanyEvents, reconcileUrgentWindow } from "/js/events.js";
  import { fmtDate, escapeHTML, statusPill, initTabs } from "/js/ui.js";

  mountLayout({ role: "company" });
  const { user } = await requireAuth("company");
  const events = await Promise.all((await listCompanyEvents(user.uid)).map(reconcileUrgentWindow));

  const eventRow = (e) => `
    <a href="/company/event.html?id=${encodeURIComponent(e.id)}" class="list-row">
      <div class="list-row-main">
        <div class="list-row-title">${escapeHTML(e.eventName)}${e.hiringType === "urgent" ? ` <span class="badge badge-urgent">Urgent</span>` : ""}</div>
        <div class="list-row-sub">${fmtDate(e.date)} · ${escapeHTML(e.location)}</div>
      </div>
      <div class="list-row-side">
        ${statusPill(e.status)}
        <span>${e.positionsFilled || 0} of ${e.positionsRequired} filled</span>
      </div>
    </a>`;

  initTabs(document.getElementById("tabs"), (tab) => {
    const items = tab === "all" ? events
      : tab === "closed" ? events.filter((e) => ["cancelled", "window_ended"].includes(e.status))
      : events.filter((e) => e.status === tab);
    document.getElementById("list").innerHTML = items.length
      ? `<div class="list">${items.map(eventRow).join("")}</div>`
      : `<div class="empty-state boxed">${events.length ? "No events in this list." : `You haven't posted anything yet. <a class="link" href="/company/post-event.html">Post an event</a>`}</div>`;
  });
</script>
</body>
</html>
