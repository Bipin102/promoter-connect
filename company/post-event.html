<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Post an event · Promoter Connect</title>
<script>try{var t=localStorage.getItem("pc-theme")}catch(e){}document.documentElement.setAttribute("data-theme",t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"))</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
<div id="pc-navbar"></div>

<main class="page-shell narrow" id="main">
  <div class="page-header">
    <div>
      <h1>Post an event</h1>
      <p>Promoters see this as soon as you post it.</p>
    </div>
  </div>

  <form id="event-form" novalidate>
    <div class="card mb-24">
      <fieldset style="border:0;padding:0;margin:0">
        <legend class="card-title">How do you want to hire?</legend>
        <div class="radio-card-group">
          <label class="radio-card" data-type="normal">
            <input type="radio" name="hiringType" value="normal" />
            <h4>Regular</h4>
            <p>Promoters apply and you choose who to accept.</p>
          </label>
          <label class="radio-card urgent" data-type="urgent">
            <input type="radio" name="hiringType" value="urgent" />
            <h4>Urgent, within the hour</h4>
            <p>Promoters book spots directly. The post stays open for 60 minutes.</p>
          </label>
        </div>
      </fieldset>
    </div>

    <div class="card mb-24">
      <h2 class="card-title">The event</h2>
      <div class="field-row">
        <div class="field"><label for="eventName">Event name</label><input type="text" id="eventName" required placeholder="e.g. Diwali sampling drive" /></div>
        <div class="field"><label for="brand">Brand or client <span class="optional">(optional)</span></label><input type="text" id="brand" /></div>
      </div>
      <div class="field"><label for="category">Category <span class="optional">(optional)</span></label><input type="text" id="category" placeholder="e.g. Brand activation" /></div>
      <div class="field">
        <label for="location">Venue</label>
        <input type="text" id="location" required placeholder="e.g. Phoenix Mall, Kurla" />
        <button type="button" class="btn btn-ghost btn-sm mt-8" id="use-location-btn">I'm at the venue, use my location</button>
        <p class="field-hint" id="location-geo-status">Optional. Lets nearby promoters see how far away the venue is.</p>
      </div>
      <div class="field-row">
        <div class="field"><label for="date">Date</label><input type="date" id="date" required /></div>
        <div class="field"><label for="positionsRequired">Promoters needed</label><input type="number" id="positionsRequired" min="1" value="1" inputmode="numeric" required /></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="startTime">Start time</label><input type="time" id="startTime" required /></div>
        <div class="field"><label for="endTime">End time</label><input type="time" id="endTime" required /></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="paymentAmount">Pay (₹)</label><input type="number" id="paymentAmount" min="0" step="50" inputmode="numeric" required /></div>
        <div class="field"><label for="paymentType">Paid</label>
          <select id="paymentType"><option value="per_event">Per event</option><option value="per_day">Per day</option><option value="per_hour">Per hour</option></select>
        </div>
      </div>
      <div class="field"><label for="description">What they'll be doing <span class="optional">(optional)</span></label><textarea id="description" rows="4"></textarea></div>
    </div>

    <div class="card mb-24">
      <h2 class="card-title">Requirements <span class="optional text-faint" style="font-weight:400">(all optional)</span></h2>
      <div class="field-row">
        <div class="field"><label for="genderReq">Gender</label>
          <select id="genderReq"><option value="">Any</option><option>Female</option><option>Male</option></select>
        </div>
        <div class="field"><label for="ageReq">Age</label><input type="text" id="ageReq" placeholder="e.g. 20–30" /></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="experienceReq">Experience</label><input type="text" id="experienceReq" placeholder="e.g. 1+ years" /></div>
        <div class="field"><label for="dressCode">Dress code</label><input type="text" id="dressCode" placeholder="e.g. Black formals" /></div>
      </div>
      <div class="field"><label for="skillsReq">Skills</label><input type="text" id="skillsReq" placeholder="Hosting, sampling" /><p class="field-hint">Separate with commas</p></div>
      <div class="field"><label for="specialInstructions">Instructions for the day</label><textarea id="specialInstructions" rows="2" placeholder="Where to report, who to ask for, what to bring"></textarea></div>
      <div class="field" style="margin-bottom:0"><label for="contactPerson">On-ground contact</label><input type="text" id="contactPerson" placeholder="Name and phone number" /><p class="field-hint">Visible to promoters who can see this post.</p></div>
    </div>

    <div class="form-error" id="err" role="alert"></div>
    <button type="submit" class="btn btn-lg btn-block btn-primary" id="submit-btn">Post event</button>
  </form>
</main>

<div id="pc-footer"></div>

<script type="module">
  import { requireAuth } from "/js/auth.js";
  import { mountLayout } from "/js/layout.js";
  import { postEvent } from "/js/events.js";
  import { updateCompany, getCompany } from "/js/db.js";
  import { toast } from "/js/ui.js";
  import { getCurrentLocation } from "/js/geo.js";

  mountLayout({ role: "company" });
  const { user } = await requireAuth("company");
  const $ = (id) => document.getElementById(id);

  $("date").min = new Date().toLocaleDateString("en-CA");

  let locationGeo = null;
  $("use-location-btn").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    const status = $("location-geo-status");
    btn.disabled = true; btn.textContent = "Getting location…";
    try {
      locationGeo = await getCurrentLocation();
      status.textContent = "Venue location saved. Promoters will see how far away it is.";
      status.className = "field-hint ok";
    } catch (err) {
      status.textContent = err.message;
      status.className = "field-hint error";
    } finally {
      btn.disabled = false; btn.textContent = "I'm at the venue, use my location";
    }
  });

  let hiringType = "normal";
  const submitBtn = $("submit-btn");
  function selectType(card) {
    document.querySelectorAll(".radio-card").forEach((c) => c.classList.toggle("selected", c === card));
    card.querySelector("input").checked = true;
    hiringType = card.dataset.type;
    submitBtn.className = `btn btn-lg btn-block ${hiringType === "urgent" ? "btn-urgent" : "btn-primary"}`;
    submitBtn.textContent = hiringType === "urgent" ? "Post and start the hour" : "Post event";
  }
  document.querySelectorAll(".radio-card").forEach((card) => card.querySelector("input").addEventListener("change", () => selectType(card)));
  selectType(document.querySelector(`.radio-card[data-type="${location.hash === "#urgent" ? "urgent" : "normal"}"]`));

  function validate(data) {
    if (!data.eventName) return "Give the event a name.";
    if (!data.location) return "Add the venue.";
    if (!data.date) return "Pick a date.";
    if (!data.startTime || !data.endTime) return "Add a start and end time.";
    if (!(Number(data.positionsRequired) >= 1)) return "You need at least one promoter.";
    if (data.paymentAmount === "" || Number(data.paymentAmount) < 0) return "Add how much you're paying.";
    return null;
  }

  $("event-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errBox = $("err");
    errBox.classList.remove("show");
    const val = (id) => $(id).value.trim();
    const data = {
      eventName: val("eventName"),
      brand: val("brand"),
      category: val("category"),
      location: val("location"),
      locationGeo,
      date: val("date"),
      startTime: val("startTime"),
      endTime: val("endTime"),
      positionsRequired: val("positionsRequired"),
      genderReq: val("genderReq"),
      ageReq: val("ageReq"),
      experienceReq: val("experienceReq"),
      skillsReq: val("skillsReq").split(",").map((s) => s.trim()).filter(Boolean),
      dressCode: val("dressCode"),
      description: val("description"),
      paymentAmount: val("paymentAmount"),
      paymentType: val("paymentType"),
      specialInstructions: val("specialInstructions"),
      contactPerson: val("contactPerson"),
      hiringType,
    };
    const problem = validate(data);
    if (problem) {
      errBox.textContent = problem;
      errBox.classList.add("show");
      return;
    }

    const label = submitBtn.textContent;
    submitBtn.disabled = true; submitBtn.textContent = "Posting…";
    try {
      const eventId = await postEvent(user.uid, data);
      const company = await getCompany(user.uid);
      await updateCompany(user.uid, { eventsPosted: (company.eventsPosted || 0) + 1 });
      location.href = `/company/event.html?id=${encodeURIComponent(eventId)}&posted=1`;
    } catch {
      toast("Couldn't post the event. Please try again.", "error");
      submitBtn.disabled = false; submitBtn.textContent = label;
    }
  });
</script>
</body>
</html>
