<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Find promoters · Promoter Connect</title>
<script>try{var t=localStorage.getItem("pc-theme")}catch(e){}document.documentElement.setAttribute("data-theme",t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"))</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
<div id="pc-navbar"></div>

<main class="page-shell" id="main">
  <div class="page-header">
    <div>
      <h1>Find promoters</h1>
      <p>Browse profiles, ratings and past work.</p>
    </div>
  </div>

  <form class="search-bar" id="search-form" role="search">
    <label for="f-keyword" class="sr-only">Search promoters</label>
    <input class="input" type="search" id="f-keyword" placeholder="Name, city, skill or brand" />
    <button class="btn btn-primary" type="submit">Search</button>
  </form>

  <button type="button" class="btn btn-secondary btn-sm filters-toggle" id="filters-toggle" aria-expanded="false" aria-controls="filter-bar">Filters</button>
  <div class="filter-bar" id="filter-bar">
    <div class="field"><label for="f-city">City</label><input type="text" id="f-city" placeholder="e.g. Pune" /></div>
    <div class="field"><label for="f-skill">Skill</label><input type="text" id="f-skill" placeholder="e.g. Hosting" /></div>
    <div class="field"><label for="f-lang">Language</label><input type="text" id="f-lang" placeholder="e.g. Marathi" /></div>
    <div class="field"><label for="f-gender">Gender</label>
      <select id="f-gender"><option value="">Any</option><option>Female</option><option>Male</option><option>Other</option></select>
    </div>
    <div class="field"><label for="f-rating">Rating</label>
      <select id="f-rating"><option value="">Any</option><option value="4">4 and up</option><option value="4.5">4.5 and up</option></select>
    </div>
  </div>

  <div class="results-meta">
    <span id="result-count" aria-live="polite"></span>
    <label class="checkbox"><input type="checkbox" id="f-available" /><span>Available for work only</span></label>
  </div>

  <div id="results" class="card-grid"></div>
  <div id="empty" class="empty-state boxed hidden"><h3>No promoters match</h3>Try removing a filter.</div>
</main>

<div id="pc-footer"></div>

<script type="module">
  import { requireAuth } from "/js/auth.js";
  import { mountLayout } from "/js/layout.js";
  import { listPromoters } from "/js/db.js";
  import { stars, badgeList, escapeHTML, avatarHTML, skeletonCards, toast } from "/js/ui.js";

  mountLayout({ role: "company" });
  await requireAuth("company");
  const $ = (id) => document.getElementById(id);
  let loadId = 0;

  async function load() {
    const thisLoad = ++loadId;
    $("results").innerHTML = skeletonCards(6, 3);
    $("empty").classList.add("hidden");
    let promoters;
    try {
      promoters = await listPromoters({
        keyword: $("f-keyword").value.trim(),
        city: $("f-city").value.trim(),
        skill: $("f-skill").value.trim(),
        language: $("f-lang").value.trim(),
        gender: $("f-gender").value,
        minRating: $("f-rating").value,
        availability: $("f-available").checked ? "available" : "",
      });
    } catch {
      $("results").innerHTML = "";
      return toast("Couldn't load promoters. Please try again.", "error");
    }
    if (thisLoad !== loadId) return;

    $("result-count").textContent = `${promoters.length} ${promoters.length === 1 ? "promoter" : "promoters"}`;
    $("empty").classList.toggle("hidden", promoters.length > 0);
    $("results").innerHTML = promoters.map((p) => `
      <a href="/shared/promoter-profile.html?id=${encodeURIComponent(p.id)}" class="card">
        <div class="flex gap-12 mb-16" style="align-items:center">
          ${avatarHTML(p.photoURL, p.fullName, "lg")}
          <div style="min-width:0">
            <strong>${escapeHTML(p.fullName || "Promoter")}</strong>
            <div class="text-dim text-sm">${escapeHTML(p.city || "City not set")}</div>
            <div class="mt-8">${stars(p.ratingAvg || 0, p.ratingCount || 0)}</div>
          </div>
        </div>
        <p class="text-dim text-sm">${p.eventsCompleted || 0} events · ${p.yearsExperience || 0} ${p.yearsExperience === 1 ? "year" : "years"} experience</p>
        ${(p.skills || []).length ? `<p class="text-sm mt-8">${escapeHTML(p.skills.slice(0, 4).join(", "))}</p>` : ""}
        <div class="profile-badges">${badgeList(p, "promoter")}</div>
      </a>`).join("");
  }

  $("filters-toggle").addEventListener("click", (e) => {
    const open = $("filter-bar").classList.toggle("open");
    e.currentTarget.setAttribute("aria-expanded", String(open));
  });

  let debounce;
  const reload = () => { clearTimeout(debounce); debounce = setTimeout(load, 250); };
  $("search-form").addEventListener("submit", (e) => { e.preventDefault(); load(); });
  ["f-gender", "f-rating", "f-available"].forEach((id) => $(id).addEventListener("change", load));
  ["f-city", "f-skill", "f-lang"].forEach((id) => $(id).addEventListener("input", reload));
  load();
</script>
</body>
</html>
