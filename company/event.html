<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Event · Promoter Connect</title>
<script>try{var t=localStorage.getItem("pc-theme")}catch(e){}document.documentElement.setAttribute("data-theme",t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"))</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
<div id="pc-navbar"></div>

<main class="page-shell narrow" id="main">
  <a href="/company/manage-events.html" class="back-link" id="back-link"></a>
  <div id="content"><div class="loading-state"><div class="spinner"></div></div></div>
</main>

<div id="pc-footer"></div>

<script type="module">
  import { requireAuth } from "/js/auth.js";
  import { mountLayout } from "/js/layout.js";
  import { watchEvent, reconcileUrgentWindow, cancelEvent, reopenUrgentEvent, URGENT_WINDOW_MS } from "/js/events.js";
  import { watchCompanyBookingsForEvent, listApplicationsForEvent, respondToApplication, completeEvent } from "/js/booking.js";
  import { listCheckInsForEvent } from "/js/checkin.js";
  import { hasRated, submitRating, categoriesFor } from "/js/ratings.js";
  import { eventDetailsHTML } from "/js/render.js";
  import { toast, confirmDialog, escapeHTML, safeUrl, statusPill, avatarHTML, fmtCountdown, fmtTimestamp, openModal } from "/js/ui.js";
  import { icon } from "/js/icons.js";
  import { mountRatingForm } from "/js/rating-form.js";

  mountLayout({ role: "company" });
  const { user } = await requireAuth("company");
  document.getElementById("back-link").innerHTML = `${icon("arrowLeft", 14)}All events`;

  const params = new URLSearchParams(location.search);
  const eventId = params.get("id");
  const content = document.getElementById("content");
  const notFound = () => {
    content.innerHTML = `<div class="empty-state boxed"><h3>Event not found</h3><a class="link" href="/company/manage-events.html">Back to your events</a></div>`;
  };
  if (params.has("posted")) {
    toast("Your event is live.", "success");
    history.replaceState(null, "", `?id=${encodeURIComponent(eventId)}`);
  }

  let event = null;
  let bookings = [];
  let applications = [];
  let checkIns = [];
  let timer = null;

  if (!eventId) notFound();
  else {
    watchEvent(eventId, async (ev) => {
      if (!ev || ev.companyId !== user.uid) return notFound();
      event = await reconcileUrgentWindow(ev);
      render();
    });
    watchCompanyBookingsForEvent(eventId, (list) => {
      bookings = list;
      // A new booking may come with a check-in; keep both in step.
      listCheckInsForEvent(eventId).then((c) => { checkIns = c; render(); });
    });
    refreshApplications();
  }

  async function refreshApplications() {
    applications = await listApplicationsForEvent(eventId);
    render();
  }

  function render() {
    if (!event) return;
    const e = event;
    const isUrgent = e.hiringType === "urgent";
    const active = bookings.filter((b) => b.status !== "cancelled");
    const isClosed = ["completed", "cancelled"].includes(e.status);
    const pending = applications.filter((a) => a.status === "pending");

    content.innerHTML = `
      <div class="card mb-24">
        <div class="event-header">
          <div>
            <h1>${escapeHTML(e.eventName)}</h1>
            <p>${escapeHTML([e.brand, isUrgent ? "Urgent" : "Regular"].filter(Boolean).join(" · "))}</p>
          </div>
          ${statusPill(e.status)}
        </div>
        ${eventDetailsHTML(e)}
        ${isClosed ? "" : `
        <div class="event-actions">
          ${active.length ? `<button class="btn btn-primary" id="complete-btn">Mark event as done</button>` : ""}
          <button class="btn btn-danger" id="cancel-btn">Cancel event</button>
        </div>`}
      </div>

      ${isUrgent && !isClosed ? trackerHTML(e) : ""}

      ${!isUrgent && applications.length ? `
      <section class="section">
        <div class="section-head"><h2>Applications</h2><span class="text-dim text-sm">${pending.length} waiting</span></div>
        <div class="list">${applications.map(applicationRowHTML).join("")}</div>
      </section>` : ""}

      <section class="section">
        <div class="section-head"><h2>Confirmed promoters</h2><span class="text-dim text-sm">${active.length} of ${e.positionsRequired}</span></div>
        ${active.length
          ? `<div class="list">${active.map(bookingRowHTML).join("")}</div>`
          : `<div class="empty-state boxed">${isUrgent ? "No one has booked yet. Promoters see urgent posts at the top of their list." : "No one confirmed yet. Accept applications above as they come in."}</div>`}
      </section>`;

    bindActions(e);
    startTimer(e);
  }

  function trackerHTML(e) {
    const filled = e.positionsFilled || 0;
    if (e.status === "fulfilled") {
      const startedAt = e.urgentDeadlineMs ? e.urgentDeadlineMs - URGENT_WINDOW_MS : null;
      const doneAt = e.fulfilledAt?.toDate ? e.fulfilledAt.toDate().getTime() : Date.now();
      const minutes = startedAt ? Math.max(1, Math.round((doneAt - startedAt) / 60000)) : null;
      return `
        <div class="tracker-result success mb-24">
          <h2>All ${e.positionsRequired} spots filled</h2>
          ${minutes ? `<p>Took ${minutes} ${minutes === 1 ? "minute" : "minutes"}.</p>` : ""}
        </div>`;
    }
    if (e.status === "window_ended") {
      const left = Math.max(0, e.positionsRequired - filled);
      return `
        <div class="tracker-result partial mb-24">
          <h2>The hour is up: ${filled} of ${e.positionsRequired} filled</h2>
          <p>${left} ${left === 1 ? "spot is" : "spots are"} still open. You can keep looking for another hour, or cancel the event.</p>
          <div class="actions"><button class="btn btn-secondary" id="reopen-btn">Keep looking for another hour</button></div>
        </div>`;
    }
    return `
      <div class="tracker mb-24">
        <div class="tracker-head">
          <div><div class="tracker-title">Filling spots</div><div class="tracker-label">Promoters can book until the timer runs out</div></div>
          <span class="tracker-timer" id="tracker-timer">--:--</span>
        </div>
        <div class="tracker-progress-track"><div class="tracker-progress-fill" style="width:${Math.min(100, (filled / e.positionsRequired) * 100)}%"></div></div>
        <div class="tracker-counts"><span>${filled} of ${e.positionsRequired} confirmed</span><span>${Math.max(0, e.positionsRequired - filled)} to go</span></div>
      </div>`;
  }

  function applicationRowHTML(a) {
    return `
      <div class="list-row wrap">
        ${avatarHTML("", a.promoterName)}
        <div class="list-row-main">
          <div class="list-row-title">${escapeHTML(a.promoterName)}</div>
          <div class="list-row-sub">Applied ${fmtTimestamp(a.appliedAt)}</div>
        </div>
        <div class="list-row-actions">
          <a href="/shared/promoter-profile.html?id=${encodeURIComponent(a.promoterId)}" class="btn btn-ghost btn-sm">Profile</a>
          ${a.status === "pending" ? `
            <button class="btn btn-secondary btn-sm" data-reject="${escapeHTML(a.id)}">Decline</button>
            <button class="btn btn-primary btn-sm" data-accept="${escapeHTML(a.id)}">Accept</button>` : statusPill(a.status)}
        </div>
      </div>`;
  }

  function bookingRowHTML(b) {
    const checkIn = checkIns.find((c) => c.bookingId === b.id);
    const photo = checkIn && safeUrl(checkIn.photoURL);
    return `
      <div class="list-row wrap">
        ${avatarHTML("", b.promoterName)}
        <div class="list-row-main">
          <div class="list-row-title">${escapeHTML(b.promoterName)}</div>
          <div class="list-row-sub">Code <code>${escapeHTML(b.bookingCode)}</code></div>
          ${checkIn ? `<div class="checkin-arrived">Arrived ${fmtTimestamp(checkIn.timestamp)}${photo ? ` · <a class="link" href="${photo}" target="_blank" rel="noopener">photo</a>` : ""}</div>` : ""}
        </div>
        <div class="list-row-actions">
          ${statusPill(b.status)}
          <a href="/shared/promoter-profile.html?id=${encodeURIComponent(b.promoterId)}" class="btn btn-ghost btn-sm">Profile</a>
          ${b.status === "completed" ? `<button class="btn btn-secondary btn-sm" data-rate="${escapeHTML(b.id)}">Rate</button>` : ""}
        </div>
      </div>`;
  }

  function startTimer(e) {
    clearInterval(timer);
    if (e.hiringType !== "urgent" || e.status !== "open") return;
    const tick = () => {
      const el = document.getElementById("tracker-timer");
      if (!el) return;
      const ms = e.urgentDeadlineMs - Date.now();
      el.textContent = fmtCountdown(ms);
      el.classList.toggle("ending", ms < 5 * 60 * 1000);
      if (ms <= 0) { clearInterval(timer); reconcileUrgentWindow(e); }
    };
    tick();
    timer = setInterval(tick, 1000);
  }

  async function withButton(btn, busyLabel, fn) {
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = busyLabel;
    try { await fn(); }
    catch (err) {
      toast(err.message === "FULL" ? "All spots are already filled." : "That didn't work. Please try again.", "error");
      btn.disabled = false; btn.textContent = label;
    }
  }

  function bindActions(e) {
    document.getElementById("cancel-btn")?.addEventListener("click", async (ev) => {
      const confirmed = bookings.some((b) => !["cancelled", "completed"].includes(b.status));
      const ok = await confirmDialog(
        confirmed ? "Cancel this event? Everyone who's booked will be notified and their bookings cancelled." : "Cancel this event? It will be taken down.",
        { confirmLabel: "Cancel event", danger: true });
      if (!ok) return;
      await withButton(ev.target, "Cancelling…", async () => {
        const notified = await cancelEvent(e);
        toast(notified ? `Event cancelled. ${notified} ${notified === 1 ? "promoter was" : "promoters were"} notified.` : "Event cancelled.");
      });
    });

    document.getElementById("complete-btn")?.addEventListener("click", async (ev) => {
      const ok = await confirmDialog("Mark this event as done? Bookings are closed out and you can rate each promoter.", { confirmLabel: "Mark as done" });
      if (!ok) return;
      await withButton(ev.target, "Saving…", async () => {
        await completeEvent(e.id);
        toast("Event marked as done. You can now rate your promoters.", "success");
      });
    });

    document.getElementById("reopen-btn")?.addEventListener("click", (ev) => withButton(ev.target, "Reopening…", async () => {
      await reopenUrgentEvent(e.id);
      toast("Open for another hour.", "success");
    }));

    content.querySelectorAll("[data-accept]").forEach((btn) => btn.addEventListener("click", () => withButton(btn, "Accepting…", async () => {
      await respondToApplication(btn.dataset.accept, "accepted");
      toast("Accepted. They've been notified.", "success");
      refreshApplications();
    })));
    content.querySelectorAll("[data-reject]").forEach((btn) => btn.addEventListener("click", () => withButton(btn, "Declining…", async () => {
      await respondToApplication(btn.dataset.reject, "rejected");
      refreshApplications();
    })));
    content.querySelectorAll("[data-rate]").forEach((btn) => btn.addEventListener("click", () => openRating(btn.dataset.rate)));
  }

  async function openRating(bookingId) {
    const booking = bookings.find((b) => b.id === bookingId);
    if (await hasRated(bookingId, "company")) return toast(`You've already rated ${booking.promoterName} for this event.`);
    const modal = openModal(`
      <h2>Rate ${escapeHTML(booking.promoterName)}</h2>
      <p class="text-dim text-sm mb-16">Other companies see this on their profile.</p>
      <div id="modal-rating"></div>`);
    mountRatingForm(modal.querySelector("#modal-rating"), categoriesFor("company"), async (values, comment) => {
      await submitRating(booking, "company", values, comment);
      toast("Rating saved.", "success");
      modal.close();
    });
  }
</script>
</body>
</html>
