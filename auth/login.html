<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log in · Promoter Connect</title>
<script>try{var t=localStorage.getItem("pc-theme")}catch(e){}document.documentElement.setAttribute("data-theme",t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"))</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/components.css" />
</head>
<body>
<main class="auth-shell" id="main">
  <div class="auth-card">
    <a href="/" class="pc-logo"><img src="/assets/icon-64.png" class="pc-logo-mark" alt="" width="28" height="28" />Promoter Connect</a>
    <h1 class="auth-title">Log in</h1>
    <p class="auth-sub">Welcome back.</p>

    <div class="form-error" id="err" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <div class="forgot-row"><button type="button" id="forgot-btn">Forgot password?</button></div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Log in</button>
    </form>

    <p class="auth-switch">New here? <a href="/auth/signup">Create an account</a></p>
  </div>
</main>

<script type="module">
  import { login, resetPassword, getUserDoc } from "/js/auth.js";
  import { toast } from "/js/ui.js";

  const errBox = document.getElementById("err");
  const showError = (msg) => { errBox.textContent = msg; errBox.classList.add("show"); };

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    errBox.classList.remove("show");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) return showError("Enter your email and password.");

    const btn = document.getElementById("submit-btn");
    btn.disabled = true; btn.textContent = "Logging in…";
    try {
      const user = await login(email, password);
      const profile = await getUserDoc(user.uid);
      if (!profile) location.href = "/auth/complete-profile";
      else location.href = profile.role === "company" ? "/company/dashboard" : "/promoter/dashboard";
    } catch (err) {
      showError(authErrorMessage(err));
      btn.disabled = false; btn.textContent = "Log in";
    }
  });

  document.getElementById("forgot-btn").addEventListener("click", async () => {
    errBox.classList.remove("show");
    const email = document.getElementById("email").value.trim();
    if (!email) {
      document.getElementById("email").focus();
      return showError("Enter your email above and we'll send you a reset link.");
    }
    try {
      await resetPassword(email);
      toast(`If there's an account for ${email}, a reset link is on its way.`, "success", 6000);
    } catch (err) {
      showError(authErrorMessage(err));
    }
  });

  function authErrorMessage(err) {
    const code = err.code || "";
    if (code.includes("user-not-found") || code.includes("invalid-credential") || code.includes("wrong-password")) return "That email and password don't match an account.";
    if (code.includes("invalid-email")) return "That email address doesn't look right.";
    if (code.includes("too-many-requests")) return "Too many attempts. Wait a few minutes and try again.";
    if (code.includes("network-request-failed")) return "You seem to be offline. Check your connection and try again.";
    return "Something went wrong. Please try again.";
  }
</script>
</body>
</html>
