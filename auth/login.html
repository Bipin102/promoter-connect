<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log in · Promoter Connect</title>
<script>try{var t=localStorage.getItem("pc-theme")}catch(e){}document.documentElement.setAttribute("data-theme",t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"))</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/components.css" />
</head>
<body>
<main class="auth-shell" id="main">
  <div class="auth-card">
    <a href="/" class="pc-logo"><img src="/assets/icon-64.png" class="pc-logo-mark" alt="" width="28" height="28" />Promoter Connect</a>
    <h1 class="auth-title">Log in</h1>
    <p class="auth-sub">Welcome back.</p>

    <div class="form-error" id="err" role="alert"></div>

    <button type="button" class="btn btn-secondary btn-block btn-lg google-btn" id="google-btn">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continue with Google
    </button>

    <div class="auth-divider"><span>or log in with email</span></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <div class="forgot-row"><button type="button" id="forgot-btn">Forgot password?</button></div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Log in</button>
    </form>

    <p class="auth-switch">New here? <a href="/auth/signup">Create an account</a></p>
  </div>
</main>

<script type="module">
  import { login, resetPassword, getUserDoc, continueWithGoogle, authErrorMessage } from "/js/auth.js";
  import { toast } from "/js/ui.js";

  const errBox = document.getElementById("err");
  const showError = (msg) => { if (!msg) return; errBox.textContent = msg; errBox.classList.add("show"); };
  const goHome = (profile) => {
    if (!profile) location.href = "/auth/complete-profile";
    else location.href = profile.role === "company" ? "/company/dashboard" : "/promoter/dashboard";
  };

  document.getElementById("google-btn").addEventListener("click", async (e) => {
    errBox.classList.remove("show");
    const btn = e.currentTarget;
    btn.disabled = true;
    try {
      const { profile } = await continueWithGoogle();
      goHome(profile);
    } catch (err) {
      showError(authErrorMessage(err));
      btn.disabled = false;
    }
  });

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    errBox.classList.remove("show");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) return showError("Enter your email and password.");

    const btn = document.getElementById("submit-btn");
    btn.disabled = true; btn.textContent = "Logging in…";
    try {
      const user = await login(email, password);
      goHome(await getUserDoc(user.uid));
    } catch (err) {
      showError(authErrorMessage(err));
      btn.disabled = false; btn.textContent = "Log in";
    }
  });

  document.getElementById("forgot-btn").addEventListener("click", async () => {
    errBox.classList.remove("show");
    const email = document.getElementById("email").value.trim();
    if (!email) {
      document.getElementById("email").focus();
      return showError("Enter your email above and we'll send you a reset link.");
    }
    try {
      await resetPassword(email);
      toast(`If there's an account for ${email}, a reset link is on its way.`, "success", 6000);
    } catch (err) {
      showError(authErrorMessage(err));
    }
  });

</script>
</body>
</html>
