<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign up · Promoter Connect</title>
<script>try{var t=localStorage.getItem("pc-theme")}catch(e){}document.documentElement.setAttribute("data-theme",t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"))</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/components.css" />
</head>
<body>
<main class="auth-shell" id="main">
  <div class="auth-card">
    <a href="/" class="pc-logo"><img src="/assets/icon-64.png" class="pc-logo-mark" alt="" width="28" height="28" />Promoter Connect</a>
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-sub">Takes about a minute. You can fill in your profile after.</p>

    <div class="form-error" id="err" role="alert"></div>

    <form id="signup-form" novalidate>
      <fieldset class="field" style="border:0;padding:0;margin:0 0 18px">
        <legend class="field-label">I'm signing up as</legend>
        <div class="radio-card-group">
          <label class="radio-card" data-role="promoter">
            <input type="radio" name="role" value="promoter" required />
            <h4>Promoter</h4>
            <p>I want to find gigs and get booked.</p>
          </label>
          <label class="radio-card" data-role="company">
            <input type="radio" name="role" value="company" />
            <h4>Company</h4>
            <p>I hire promoters for events.</p>
          </label>
        </div>
      </fieldset>
      <div class="field">
        <label for="name" id="name-label">Full name</label>
        <input type="text" id="name" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="new-password" required minlength="6" />
          <p class="field-hint">At least 6 characters</p>
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" autocomplete="new-password" required minlength="6" />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="/auth/login">Log in</a></p>
  </div>
</main>

<script type="module">
  import { signup } from "/js/auth.js";

  const cards = document.querySelectorAll(".radio-card");
  function selectRole(card) {
    cards.forEach((c) => c.classList.toggle("selected", c === card));
    card.querySelector("input").checked = true;
    document.getElementById("name-label").textContent = card.dataset.role === "company" ? "Company name" : "Full name";
  }
  cards.forEach((card) => card.querySelector("input").addEventListener("change", () => selectRole(card)));
  const preselect = new URLSearchParams(location.search).get("role");
  const preselected = document.querySelector(`.radio-card[data-role="${preselect === "company" ? "company" : preselect === "promoter" ? "promoter" : ""}"]`);
  if (preselected) selectRole(preselected);

  const errBox = document.getElementById("err");
  const showError = (msg) => { errBox.textContent = msg; errBox.classList.add("show"); };

  document.getElementById("signup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    errBox.classList.remove("show");
    const role = document.querySelector('input[name="role"]:checked')?.value;
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;

    if (!role) return showError("Choose whether you're a promoter or a company.");
    if (!name) return showError("Enter your name.");
    if (!email) return showError("Enter your email address.");
    if (password.length < 6) return showError("Use a password with at least 6 characters.");
    if (password !== confirm) return showError("The two passwords don't match.");

    const btn = document.getElementById("submit-btn");
    btn.disabled = true; btn.textContent = "Creating account…";
    try {
      await signup({ email, password, role, name });
      location.href = role === "company" ? "/company/profile?onboarding=1" : "/promoter/profile?onboarding=1";
    } catch (err) {
      showError(authErrorMessage(err));
      btn.disabled = false; btn.textContent = "Create account";
    }
  });

  function authErrorMessage(err) {
    const code = err.code || "";
    if (code.includes("email-already-in-use")) return "There's already an account with this email. Try logging in instead.";
    if (code.includes("weak-password")) return "That password is too weak. Use at least 6 characters.";
    if (code.includes("invalid-email")) return "That email address doesn't look right.";
    if (code.includes("network-request-failed")) return "You seem to be offline. Check your connection and try again.";
    return "Something went wrong. Please try again.";
  }
</script>
</body>
</html>
