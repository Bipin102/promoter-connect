<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign up · Promoter Connect</title>
<script>try{var t=localStorage.getItem("pc-theme")}catch(e){}document.documentElement.setAttribute("data-theme",t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"))</script>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
<link rel="apple-touch-icon" href="/assets/icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/components.css" />
</head>
<body>
<main class="auth-shell" id="main">
  <div class="auth-card">
    <a href="/" class="pc-logo"><img src="/assets/icon-64.png" class="pc-logo-mark" alt="" width="28" height="28" />Promoter Connect</a>
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-sub">Free, and it takes a few seconds.</p>

    <div class="form-error" id="err" role="alert"></div>
    <p class="invite-note hidden" id="invite-note"></p>

    <fieldset class="field" style="border:0;padding:0;margin:0 0 20px">
      <legend class="field-label">I'm a</legend>
      <div class="radio-card-group">
        <label class="radio-card" data-role="promoter">
          <input type="radio" name="role" value="promoter" />
          <h4>Promoter</h4>
          <p>Looking for event work</p>
        </label>
        <label class="radio-card" data-role="company">
          <input type="radio" name="role" value="company" />
          <h4>Company</h4>
          <p>Hiring for events</p>
        </label>
      </div>
    </fieldset>

    <button type="button" class="btn btn-secondary btn-block btn-lg google-btn" id="google-btn">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continue with Google
    </button>

    <div class="auth-divider"><span>or sign up with email</span></div>

    <form id="signup-form" novalidate>
      <div class="field">
        <label for="name" id="name-label">Your name</label>
        <input type="text" id="name" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" inputmode="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" autocomplete="new-password" required minlength="6" />
          <button type="button" class="password-toggle" id="pw-toggle" aria-label="Show password">Show</button>
        </div>
        <p class="field-hint">At least 6 characters</p>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="/auth/login">Log in</a></p>
  </div>
</main>

<script type="module">
  import { signup, continueWithGoogle, authErrorMessage } from "/js/auth.js";
  import { lookupCode, normalizeCode, rememberPendingCode, pendingCode } from "/js/referrals.js";

  const $ = (id) => document.getElementById(id);
  const errBox = $("err");
  const showError = (msg) => { if (!msg) return; errBox.textContent = msg; errBox.classList.add("show"); };
  const clearError = () => errBox.classList.remove("show");

  const cards = document.querySelectorAll(".radio-card");
  function selectRole(card) {
    cards.forEach((c) => c.classList.toggle("selected", c === card));
    card.querySelector("input").checked = true;
    $("name-label").textContent = card.dataset.role === "company" ? "Company name" : "Your name";
    clearError();
  }
  cards.forEach((card) => card.querySelector("input").addEventListener("change", () => selectRole(card)));
  const preset = new URLSearchParams(location.search).get("role");
  if (preset === "promoter" || preset === "company") selectRole(document.querySelector(`.radio-card[data-role="${preset}"]`));
  const selectedRole = () => document.querySelector('input[name="role"]:checked')?.value;

  $("pw-toggle").addEventListener("click", (e) => {
    const input = $("password");
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    e.currentTarget.textContent = show ? "Hide" : "Show";
    e.currentTarget.setAttribute("aria-label", show ? "Hide password" : "Show password");
  });

  // Invite links land here as /auth/signup?ref=CODE (via /r/CODE).
  const refParam = new URLSearchParams(location.search).get("ref");
  if (refParam) rememberPendingCode(refParam);
  let referral = null;
  const inviteCode = normalizeCode(refParam || pendingCode());
  if (inviteCode) {
    lookupCode(inviteCode).then((referrerId) => {
      const note = $("invite-note");
      if (!referrerId) return;
      referral = { code: inviteCode, referrerId };
      note.textContent = `You were invited with code ${inviteCode}.`;
      note.classList.remove("hidden");
    }).catch(() => {});
  }

  const nextPage = (role) => role === "company" ? "/company/profile?onboarding=1" : "/promoter/profile?onboarding=1";

  $("google-btn").addEventListener("click", async (e) => {
    clearError();
    const role = selectedRole();
    if (!role) return showError("First choose whether you're a promoter or a company.");
    const btn = e.currentTarget;
    btn.disabled = true;
    try {
      const { profile, isNew } = await continueWithGoogle({ role, referral });
      if (isNew) location.href = nextPage(role);
      else location.href = profile.role === "company" ? "/company/dashboard" : "/promoter/dashboard";
    } catch (err) {
      showError(authErrorMessage(err));
      btn.disabled = false;
    }
  });

  $("signup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError();
    const role = selectedRole();
    const name = $("name").value.trim();
    const email = $("email").value.trim();
    const password = $("password").value;
    if (!role) return showError("Choose whether you're a promoter or a company.");
    if (!name) return showError("Enter your name.");
    if (!email) return showError("Enter your email address.");
    if (password.length < 6) return showError("Use a password with at least 6 characters.");

    const btn = $("submit-btn");
    btn.disabled = true; btn.textContent = "Creating account…";
    try {
      await signup({ email, password, role, name, referral });
      location.href = nextPage(role);
    } catch (err) {
      showError(authErrorMessage(err));
      btn.disabled = false; btn.textContent = "Create account";
    }
  });
</script>
</body>
</html>
