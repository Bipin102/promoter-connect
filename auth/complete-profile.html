<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>try{document.documentElement.setAttribute("data-theme", localStorage.getItem("pc-theme") || "light");}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Finish Setting Up — Promoter Connect</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/components.css" />
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <a href="/index.html" class="pc-logo"><img src="/assets/icon-64.png" class="pc-logo-mark" alt="" /> Promoter Connect</a>
    <h1 class="auth-title mt-16">Let's finish setting up your account</h1>
    <p class="auth-sub">We found your login, but your profile wasn't fully created last time. Just pick your role below and you're good to go.</p>

    <div class="auth-error" id="err"></div>

    <form id="complete-form">
      <div class="field">
        <label>I am a...</label>
        <div class="radio-card-group">
          <label class="radio-card" data-role="promoter">
            <input type="radio" name="role" value="promoter" />
            <h4>🎤 Promoter</h4>
            <p>Discover gigs, book urgent positions, build your reputation.</p>
          </label>
          <label class="radio-card" data-role="company">
            <input type="radio" name="role" value="company" />
            <h4>🏢 Event Company</h4>
            <p>Post events and get promoters confirmed within 1 hour.</p>
          </label>
        </div>
      </div>

      <div class="field">
        <label id="name-label">Full Name</label>
        <input type="text" id="name" required placeholder="Your name" />
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Continue</button>
    </form>

    <p class="auth-switch"><a href="#" id="logout-link">Not you? Log out</a></p>
  </div>
</div>

<script type="module">
  import { auth } from "/js/firebase-init.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { createUserDocs, getUserDoc, logout } from "/js/auth.js";
  import { toast } from "/js/ui.js";
  import { mountLayout } from "/js/layout.js";
  mountLayout();

  let currentUser = null;
  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "/auth/login.html"; return; }
    const existingProfile = await getUserDoc(user.uid);
    if (existingProfile) {
      window.location.href = existingProfile.role === "company" ? "/company/dashboard.html" : "/promoter/dashboard.html";
      return;
    }
    currentUser = user;
    if (user.displayName) document.getElementById("name").value = user.displayName;
  });

  document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); logout(); });

  const cards = document.querySelectorAll(".radio-card");
  cards.forEach((card) => {
    card.addEventListener("click", () => {
      cards.forEach((c) => c.classList.remove("selected"));
      card.classList.add("selected");
      card.querySelector("input").checked = true;
      document.getElementById("name-label").textContent =
        card.dataset.role === "company" ? "Company Name" : "Full Name";
    });
  });

  const errBox = document.getElementById("err");
  function showError(msg) { errBox.textContent = msg; errBox.classList.add("show"); }

  document.getElementById("complete-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    errBox.classList.remove("show");
    if (!currentUser) return showError("Still confirming your session — please wait a moment and try again.");
    const role = document.querySelector('input[name="role"]:checked')?.value;
    const name = document.getElementById("name").value.trim();
    if (!role) return showError("Please select whether you're a Promoter or an Event Company.");

    const btn = document.getElementById("submit-btn");
    btn.disabled = true; btn.textContent = "Setting up...";
    try {
      await createUserDocs(currentUser, { role, name, email: currentUser.email });
      toast("Account set up! Complete your profile so you can be discovered.", "success");
      window.location.href = role === "company" ? "/company/profile.html?onboarding=1" : "/promoter/profile.html?onboarding=1";
    } catch (err) {
      showError(err.message || "Something went wrong. Please try again.");
      btn.disabled = false; btn.textContent = "Continue";
    }
  });
</script>
</body>
</html>
